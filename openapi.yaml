openapi: 3.1.0
info:
  title: Smart Campus — Camera Stream → Analytics (Pair 07)
  version: 1.0.0
  description: |
    Hợp đồng REST facade cho dependency Queue async (Camera Stream → Analytics).
    Lab 02 dùng REST để mock; Lab 03 sẽ đặc tả AsyncAPI/topic schema chi tiết.
  contact:
    name: FIT4110 Teaching Team
    email: fit4110@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.campus.local
    description: Class network placeholder
tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: camera-events
    description: Ghi nhận và truy vấn event camera
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service còn hoạt động.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: camera-analytics-contract
                    time: '2026-05-10T08:00:00Z'

  /camera-events:
    post:
      operationId: createCameraEvent
      summary: Gửi event camera
      description: |
        Camera Stream gửi event sang Analytics. Đây là REST facade để mock cho Lab 02.
      tags: [camera-events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraEvent'
            examples:
              motionDetected:
                value:
                  eventType: camera.motion.detected
                  eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                  occurredAt: '2026-05-10T08:00:00Z'
                  cameraId: CAM-007
                  sourceService: camera-stream
                  correlationId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b000
                  detectionId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b111
                  motionType: HUMAN
                  imageRef: https://cdn.campus.local/camera/CAM-007/frame-001.jpg
                  confidence: 0.92
              frameAnalyzed:
                value:
                  eventType: camera.frame.analyzed
                  eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babd
                  occurredAt: '2026-05-10T08:01:00Z'
                  cameraId: CAM-007
                  sourceService: camera-stream
                  correlationId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b000
                  detectionId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b111
                  imageRef: https://cdn.campus.local/camera/CAM-007/frame-001.jpg
                  analysisSummary:
                    objectsDetected: 2
                    abnormal: false
                    confidence: 0.87
              statusChanged:
                value:
                  eventType: camera.status.changed
                  eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babe
                  occurredAt: '2026-05-10T08:02:00Z'
                  cameraId: CAM-007
                  sourceService: camera-stream
                  correlationId: null
                  status: OFFLINE
                  reason: No heartbeat
                  offlineSince: '2026-05-10T07:57:00Z'
      responses:
        '201':
          description: Event đã được ghi nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
              examples:
                accepted:
                  value:
                    eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                    acceptedAt: '2026-05-10T08:00:01Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listCameraEvents
      summary: Lấy danh sách event camera
      description: Danh sách event với cursor-based pagination (phục vụ mock).
      tags: [camera-events]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventPage'
              examples:
                firstPage:
                  value:
                    items:
                      - eventType: camera.motion.detected
                        eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        occurredAt: '2026-05-10T08:00:00Z'
                        cameraId: CAM-007
                        sourceService: camera-stream
                        correlationId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b000
                        detectionId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b111
                        motionType: HUMAN
                        imageRef: https://cdn.campus.local/camera/CAM-007/frame-001.jpg
                        confidence: 0.92
                    nextCursor: null
                    hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /camera-events/recent:
    get:
      operationId: getRecentCameraEvents
      summary: Lấy các event camera gần đây
      description: Truy vấn nhanh các event mới nhất.
      tags: [camera-events]
      parameters:
        - name: limit
          in: query
          required: false
          description: Số event tối đa cần lấy.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách event gần đây
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEventList'
              examples:
                recentEvents:
                  value:
                    items: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /camera-events/{eventId}:
    get:
      operationId: getCameraEventById
      summary: Lấy chi tiết event theo id
      description: Tra cứu event camera theo UUID.
      tags: [camera-events]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Chi tiết event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: UUID của event.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor dùng để lấy trang tiếp theo.
      schema:
        type: [string, 'null']
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Số item tối đa mỗi trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
          description: Trạng thái service.
          example: ok
        service:
          type: string
          minLength: 2
          maxLength: 80
          description: Tên service.
          example: camera-analytics-contract
        time:
          type: string
          format: date-time
          description: Thời điểm kiểm tra.
          example: '2026-05-10T08:00:00Z'

    CameraEvent:
      oneOf:
        - $ref: '#/components/schemas/MotionDetectedEvent'
        - $ref: '#/components/schemas/FrameAnalyzedEvent'
        - $ref: '#/components/schemas/CameraStatusChangedEvent'
      discriminator:
        propertyName: eventType
        mapping:
          camera.motion.detected: '#/components/schemas/MotionDetectedEvent'
          camera.frame.analyzed: '#/components/schemas/FrameAnalyzedEvent'
          camera.status.changed: '#/components/schemas/CameraStatusChangedEvent'

    MotionDetectedEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, occurredAt, cameraId, sourceService, motionType]
      properties:
        eventType:
          type: string
          const: camera.motion.detected
          description: Loại event.
          example: camera.motion.detected
        eventId:
          type: string
          format: uuid
          description: UUID của event.
        occurredAt:
          type: string
          format: date-time
          description: Thời điểm phát hiện motion.
        cameraId:
          type: string
          pattern: '^CAM-[0-9]{3}$'
          description: Mã camera.
          example: CAM-007
        sourceService:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Service phát event.
          example: camera-stream
        correlationId:
          type: [string, 'null']
          format: uuid
          description: Correlation id nếu có.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b000
        detectionId:
          type: [string, 'null']
          format: uuid
          description: Detection id nếu có.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b111
        motionType:
          type: string
          enum: [HUMAN, VEHICLE, UNKNOWN]
          description: Loại motion phát hiện.
          example: HUMAN
        imageRef:
          type: [string, 'null']
          format: uri
          description: Tham chiếu ảnh (không gửi ảnh thật).
          example: https://cdn.campus.local/camera/CAM-007/frame-001.jpg
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Độ tin cậy nếu có.
          example: 0.92

    FrameAnalyzedEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, occurredAt, cameraId, sourceService, imageRef, analysisSummary]
      properties:
        eventType:
          type: string
          const: camera.frame.analyzed
          description: Loại event.
          example: camera.frame.analyzed
        eventId:
          type: string
          format: uuid
          description: UUID của event.
        occurredAt:
          type: string
          format: date-time
          description: Thời điểm phân tích frame.
        cameraId:
          type: string
          pattern: '^CAM-[0-9]{3}$'
          description: Mã camera.
          example: CAM-007
        sourceService:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Service phát event.
          example: camera-stream
        correlationId:
          type: [string, 'null']
          format: uuid
          description: Correlation id nếu có.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b000
        detectionId:
          type: [string, 'null']
          format: uuid
          description: Detection id nếu có.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2b111
        imageRef:
          type: string
          format: uri
          description: Tham chiếu ảnh (không gửi ảnh thật).
          example: https://cdn.campus.local/camera/CAM-007/frame-001.jpg
        analysisSummary:
          type: object
          additionalProperties: false
          required: [objectsDetected, abnormal]
          properties:
            objectsDetected:
              type: integer
              minimum: 0
              maximum: 999
              description: Số object phát hiện.
              example: 2
            abnormal:
              type: boolean
              description: Cờ bất thường.
              example: false
            confidence:
              type: [number, 'null']
              minimum: 0
              maximum: 1
              description: Độ tin cậy nếu có.
              example: 0.87

    CameraStatusChangedEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, occurredAt, cameraId, sourceService, status]
      properties:
        eventType:
          type: string
          const: camera.status.changed
          description: Loại event.
          example: camera.status.changed
        eventId:
          type: string
          format: uuid
          description: UUID của event.
        occurredAt:
          type: string
          format: date-time
          description: Thời điểm thay đổi trạng thái.
        cameraId:
          type: string
          pattern: '^CAM-[0-9]{3}$'
          description: Mã camera.
          example: CAM-007
        sourceService:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Service phát event.
          example: camera-stream
        correlationId:
          type: [string, 'null']
          format: uuid
          description: Correlation id nếu có.
          example: null
        status:
          type: string
          enum: [ONLINE, OFFLINE, DEGRADED]
          description: Trạng thái camera.
          example: OFFLINE
        reason:
          type: [string, 'null']
          minLength: 3
          maxLength: 200
          description: Lý do thay đổi trạng thái nếu có.
          example: No heartbeat
        offlineSince:
          type: [string, 'null']
          format: date-time
          description: Thời điểm camera bắt đầu offline.
          example: '2026-05-10T07:57:00Z'

    CameraEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/CameraEvent'
        nextCursor:
          type: [string, 'null']
          description: Cursor trang tiếp theo, null nếu hết dữ liệu.
          example: null
        hasMore:
          type: boolean
          description: Còn dữ liệu ở trang sau hay không.
          example: false

    CameraEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/CameraEvent'

    EventAccepted:
      type: object
      additionalProperties: false
      required: [eventId, acceptedAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: UUID của event được nhận.
        acceptedAt:
          type: string
          format: date-time
          description: Thời điểm hệ thống ghi nhận event.

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: URI định danh loại lỗi.
          example: https://campus.local/errors/validation
        title:
          type: string
          minLength: 3
          maxLength: 120
          description: Tiêu đề lỗi ngắn gọn.
          example: Dữ liệu không hợp lệ
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
          example: 400
        detail:
          type: [string, 'null']
          maxLength: 500
          description: Mô tả chi tiết lỗi.
          example: Thiếu field eventId
        instance:
          type: [string, 'null']
          format: uri
          description: URI của request gây lỗi.
          example: https://api.campus.local/camera-events
        errors:
          type: array
          minItems: 0
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 80
                example: eventId
              code:
                type: string
                minLength: 2
                maxLength: 80
                example: REQUIRED
              message:
                type: string
                minLength: 3
                maxLength: 200
                example: eventId là bắt buộc

  responses:
    BadRequest:
      description: Dữ liệu sai định dạng
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://campus.local/errors/validation
            title: Dữ liệu không hợp lệ
            status: 400
            detail: Payload không đúng JSON Schema
            instance: https://api.campus.local/camera-events
            errors:
              - field: eventType
                code: ENUM_MISMATCH
                message: eventType không nằm trong danh sách cho phép

    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://campus.local/errors/unauthorized
            title: Chưa xác thực
            status: 401
            detail: Thiếu Bearer token
            instance: https://api.campus.local/camera-events
            errors: []

    Forbidden:
      description: Không có quyền thực hiện thao tác
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Resource không tồn tại
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Xung đột nghiệp vụ hoặc trùng eventId
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: Payload đúng định dạng nhưng không hợp lệ về nghiệp vụ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalServerError:
      description: Lỗi không mong muốn phía server
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
